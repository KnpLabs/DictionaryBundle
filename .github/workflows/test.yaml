---
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: "php${{ matrix.php }} symfony${{ matrix.symfony }} ${{matrix.minimumStability}} ${{ matrix.composerOptions }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        symfony:
          - "5.4"
          - "6.4"
          - "7.4"
        minimumStability:
          - "stable"
        composerOptions:
          - "--prefer-stable --prefer-lowest"
          - "--prefer-stable"
        include:
          - symfony: "5.4"
            php: "8.1"
            minimumStability: "stable"
            composerOptions: "--prefer-stable --prefer-lowest"
          - symfony: "5.4"
            php: "8.1"
            minimumStability: "stable"
            composerOptions: "--prefer-stable"
        exclude:
          # Symfony 5.4.0 and 6.4.0 emit PHP 8.4 deprecations.
          - php: "8.4"
            symfony: "5.4"
            composerOptions: "--prefer-stable --prefer-lowest"
          - php: "8.4"
            symfony: "6.4"
            composerOptions: "--prefer-stable --prefer-lowest"
          # Current Symfony 5.4 emits PHP 8.5 deprecations.
          - symfony: "5.4"
            php: "8.5"
          # Legacy dependency floors emit PHP 8.5 deprecations.
          - php: "8.5"
            composerOptions: "--prefer-stable --prefer-lowest"
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          tools: composer
          coverage: none
        env:
          fail-fast: true
      - uses: actions/checkout@v4
      - run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output symfony-composer.json \
            https://raw.githubusercontent.com/symfony/symfony/${{ matrix.symfony }}/composer.json
          jq -e '.replace | to_entries | map({key: .key, value: ("< " + "${{ matrix.symfony }}" + ".0 || >= " + ("${{ matrix.symfony }}" | (((.|tonumber + 0.1) * 10)|round / 10)|tostring) + ".0")}) | from_entries' symfony-composer.json > conflict.json
          jq -e -s '.[0] + {conflict: .[1]}' composer.json conflict.json > composer.new.json
          mv composer.new.json composer.json
          rm symfony-composer.json conflict.json
      - run: |
          jq -e -s '.[0] + {"minimum-stability": "${{ matrix.minimumStability }}"}' composer.json > composer.new.json
          mv composer.new.json composer.json
      - run: composer update --no-progress ${{ matrix.composerOptions }}
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=-1
      - run: vendor/bin/phpspec run -v --config=phpspec.no-coverage.yml
      - run: bin/lint-twig src/
      - run: PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer fix --diff --dry-run -vvv
